# Render Blueprint - defines all three services needed to run this project.
# When you connect this repo on Render and it detects this file, it offers
# to create everything below in one step instead of configuring each
# service by hand.
databases:
  - name: byumba-db
    plan: free
    databaseName: byumba
    user: byumba

services:
  # Django backend (API)
  - type: web
    name: byumba-backend
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate && python manage.py create_admin && python manage.py bootstrap_data"
    startCommand: "gunicorn core.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: ADMIN_USERNAME
        sync: false  # set manually in Render dashboard - your live admin username
      - key: ADMIN_PASSWORD
        sync: false  # set manually in Render dashboard - a strong password
      - key: CLOUDINARY_URL
        sync: false  # set manually in Render dashboard - from your Cloudinary account, for permanent photo storage
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        sync: false  # set manually: your Render backend URL + real domain once you have one
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # set manually: your Render frontend URL + real domain once you have one
      - key: CSRF_TRUSTED_ORIGINS
        sync: false  # set manually: https:// versions of your backend + real domain (needed for the Django admin login)
      - key: FRONTEND_URL
        sync: false  # set manually: your frontend URL, e.g. https://byumbaanglican.rw
      # Email - without these, password-reset codes are only printed to the log
      # and members cannot recover their accounts. Brevo/Resend/Mailgun all work.
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false  # e.g. no-reply@byumbaanglican.rw (must be allowed by your email provider)
      - key: DATABASE_URL
        fromDatabase:
          name: byumba-db
          property: connectionString

  # React frontend (static site)
  - type: web
    name: byumba-frontend
    runtime: static
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false  # set manually: https://byumba-backend.onrender.com/api (your actual backend URL + /api)
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
